# Local rosdep rules for dependencies not yet on the ROS build farm.
# Consumed by the .deb builder container (container/build_deb_container.sh) so
# bloom-generate can resolve these keys to their Debian package names. Remove a
# key once its package is released into ros/rosdistro for this distro.
px4_msgs:
  ubuntu:
    - ros-jazzy-px4-msgs
px4_ros2_cpp:
  ubuntu:
    - ros-jazzy-px4-ros2-cpp
