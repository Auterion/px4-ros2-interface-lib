name: Create Release Branch

on:
  # PX4 release branches are picked up within a day of being created
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch to create (e.g. release/1.19). Leave empty to check PX4 for a new one'
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-branch:
    # the daily check only runs in this repository, a manual run also works in a fork
    if: github.event_name != 'schedule' || github.repository == 'Auterion/px4-ros2-interface-lib'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine branch name
        id: params
        env:
          REQUESTED: ${{ inputs.branch }}
        run: scripts/find-px4-release-branch.sh "$REQUESTED"

      - name: Check if branch already exists
        id: check
        if: steps.params.outputs.branch != ''
        run: |
          BRANCH="${{ steps.params.outputs.branch }}"
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Branch '$BRANCH' already exists, skipping creation"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release branch from main
        if: steps.check.outputs.exists == 'false'
        run: |
          BRANCH="${{ steps.params.outputs.branch }}"
          SHA=$(git rev-parse HEAD)
          echo "Creating branch '$BRANCH' from main ($SHA)"
          git checkout -b "$BRANCH"

          # main pins px4_msgs to main; point the release branch at the matching px4_msgs branch
          if git ls-remote --exit-code --heads https://github.com/PX4/px4_msgs.git "$BRANCH" > /dev/null; then
            sed -i -E "/^  px4_msgs:/,/^  [a-z]/ s|^(    version: ).*|\1$BRANCH|" dependencies.repos
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(deps): pin px4_msgs to $BRANCH" dependencies.repos
          else
            echo "::warning::PX4/px4_msgs has no branch '$BRANCH' yet; dependencies.repos still pins px4_msgs to main"
          fi

          git push origin "$BRANCH"
          echo "Branch '$BRANCH' created successfully"

      - name: Summary
        if: steps.params.outputs.branch != ''
        run: |
          BRANCH="${{ steps.params.outputs.branch }}"
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "### Branch already exists" >> "$GITHUB_STEP_SUMMARY"
            echo "Branch \`$BRANCH\` already exists. No action taken." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Release branch created" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Branch:** \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Source:** \`main\` ($(git rev-parse HEAD))" >> "$GITHUB_STEP_SUMMARY"
          fi
