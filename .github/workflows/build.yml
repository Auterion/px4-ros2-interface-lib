name: Build and test

# Push builds run on the integration branches; everything else (topic branches)
# is covered by the pull_request trigger, so a PR does not run twice per commit.
#
# px4_ros2_cpp build-depends on px4_msgs and px4_ros2_py depends on px4_ros2_cpp.
# px4_msgs is not on the ROS build farm yet, so it is pulled from source via
# dependencies.repos and built alongside the packages in every job.
#
# The Linux jobs run inside the official ros:<distro>-ros-base containers. Those
# images ship a correctly configured ROS environment (a concrete rmw and the
# rosidl typesupports), which an apt-installed ros-base on a bare runner does
# not reliably provide, and it makes the runner OS irrelevant (Rolling and
# Lyrical target Ubuntu 26.04, for which there is no GitHub runner).
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build & test (${{ matrix.ros2_distro }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros2_distro: [humble, jazzy, kilted, rolling, lyrical]
    container:
      image: ros:${{ matrix.ros2_distro }}-ros-base
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.ros2_distro }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.ros2_distro }}-
      - name: Install colcon, rosdep and lint tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo ccache git python3-pip python3-colcon-common-extensions \
            python3-colcon-lcov-result python3-colcon-coveragepy-result \
            python3-rosdep python3-vcstool python3-empy \
            "ros-${{ matrix.ros2_distro }}-ament-cmake-test" \
            "ros-${{ matrix.ros2_distro }}-ament-lint-auto" \
            "ros-${{ matrix.ros2_distro }}-ament-lint-common"
          rosdep init 2>/dev/null || true
          rosdep update
          # Enable ccache via its masquerade (no COMPILER_LAUNCHER, which would
          # double-wrap); the container has no /usr/lib/ccache on PATH by default.
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          # The two library packages plus every example package, so the matrix
          # keeps whole-workspace build coverage.
          package-name: px4_ros2_cpp px4_ros2_py example_mode_goto_global_cpp example_executor_with_multiple_modes_cpp example_mode_fw_attitude_cpp example_mode_with_rclpy_py example_mode_goto_py example_mode_manual_cpp example_local_navigation_cpp example_mode_with_executor_cpp example_mode_vtol_cpp example_mode_mission_cpp example_rover_velocity_mode_cpp example_mode_goto_cpp example_mode_rtl_replacement_cpp example_global_navigation_cpp
          target-ros2-distro: ${{ matrix.ros2_distro }}
          vcs-repo-file-url: dependencies.repos
          # C++ style/lint is enforced by clang-format and clang-tidy (pre-commit
          # and the clang-tidy job), not the ament linters; run only the gtest
          # unit tests and skip the FMU-only integration tests.
          colcon-defaults: |
            {
              "test": {
                "ctest-args": ["-R", "unit_tests"]
              }
            }

  build-windows:
    name: "Build & test (jazzy / Windows)"
    # Pinned to windows-2022: action-ros-ci@v0.4 wraps commands in a hardcoded
    # VS2022 Enterprise vcvars64.bat path that does not exist on windows-2025.
    # Only px4_ros2_cpp is built here.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # Pin Python 3.11 to match Jazzy's Windows binaries and avoid ros-tooling's
      # setuptools<60 / missing-distutils breakage on Python 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: px4_ros2_cpp
          target-ros2-distro: jazzy
          vcs-repo-file-url: dependencies.repos
          colcon-defaults: |
            {
              "test": {
                "ctest-args": ["-R", "unit_tests"]
              }
            }

  build-macos:
    name: "Build & test (jazzy / macOS, RoboStack) (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
        # The osx-arm64 unit binary stalls in the first fixture at DDS
        # participant creation, emitting nothing until the 60 s test timeout.
        # The stall reproduces under both Fast DDS and Cyclone DDS, so it is
        # transport-independent and lives in the runner's network setup:
        # resolving the runner's own hostname and opening subnet-wide multicast
        # discovery block participant startup on the sandboxed arm64 host. The
        # "Resolve runner hostname" step maps that hostname onto loopback, and
        # the arm64 leg confines discovery to LOCALHOST; the osx-64 leg keeps
        # the SUBNET default it passes under. Each leg still pins a middleware
        # so both are exercised: Cyclone DDS on arm64, Fast DDS on Intel.
        include:
          - os: macos-latest
            rmw: rmw_cyclonedds_cpp
            discovery_range: LOCALHOST
          - os: macos-15-intel
            rmw: rmw_fastrtps_cpp
            discovery_range: SUBNET
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/px4_ros2_cpp_repo
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ros_jazzy
          cache-environment: true
          cache-downloads: true
          condarc: |
            channels:
              - conda-forge
              - robostack-jazzy
          create-args: >-
            python=3.11
            ros-jazzy-ros-base
            ros-jazzy-ament-cmake
            ros-jazzy-ament-lint-auto
            ros-jazzy-ament-lint-common
            ros-jazzy-eigen3-cmake-module
            ros-jazzy-rmw-cyclonedds-cpp
            colcon-common-extensions
            cmake
            ninja
            c-compiler
            cxx-compiler
            empy
      - name: Fetch px4_msgs source
        # Use a plain (non-conda) shell with the system git: inside the activated
        # micromamba environment git aborts with "dyld: Symbol not found: _iconv"
        # (the conda libraries shadow the system ones).
        shell: bash
        run: git clone https://github.com/PX4/px4_msgs.git src/px4_msgs
      - name: Build
        run: colcon build --packages-up-to px4_ros2_cpp --event-handlers console_cohesion+
      - name: Resolve runner hostname
        # A macOS runner does not resolve its own hostname, so the getaddrinfo
        # call inside DDS participant creation blocks; map the hostname onto
        # loopback so participant startup proceeds.
        shell: bash
        run: |
          echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
          echo "::1 $(hostname)" | sudo tee -a /etc/hosts
      - name: Test
        env:
          RMW_IMPLEMENTATION: ${{ matrix.rmw }}
          ROS_AUTOMATIC_DISCOVERY_RANGE: ${{ matrix.discovery_range }}
        run: colcon test --packages-select px4_ros2_cpp --event-handlers console_cohesion+ --return-code-on-test-failure --ctest-args -R unit_tests

  docs:
    name: "Docs (doxygen + sphinx)"
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install colcon, rosdep and docs tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo ccache git python3-pip python3-colcon-common-extensions \
            python3-colcon-lcov-result python3-colcon-coveragepy-result \
            python3-rosdep python3-vcstool python3-empy \
            doxygen python3-sphinx
          rosdep init 2>/dev/null || true
          rosdep update
      - name: Build (for the sphinx python bindings docs)
        id: ros-build
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: px4_ros2_cpp px4_ros2_py
          target-ros2-distro: jazzy
          vcs-repo-file-url: dependencies.repos
          skip-tests: true
      - name: Run doxygen
        run: ./scripts/run-doxygen.sh
      - name: Run sphinx
        run: |
          ROS_WS_DIR="$(readlink -f ${{ steps.ros-build.outputs.ros-workspace-directory-name }})"
          source "$ROS_WS_DIR/install/setup.bash"
          make -C python_docs html
          cp -r python_docs/_build/html docs/html/python
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html

  clang-tidy:
    name: "clang-tidy"
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install colcon, rosdep and clang-tidy
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo ccache git python3-pip python3-colcon-common-extensions \
            python3-colcon-lcov-result python3-colcon-coveragepy-result \
            python3-rosdep python3-vcstool python3-empy \
            clang-tidy
          rosdep init 2>/dev/null || true
          rosdep update
      - name: Build
        id: ros-build
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: px4_ros2_cpp px4_ros2_py example_mode_goto_global_cpp example_executor_with_multiple_modes_cpp example_mode_fw_attitude_cpp example_mode_with_rclpy_py example_mode_goto_py example_mode_manual_cpp example_local_navigation_cpp example_mode_with_executor_cpp example_mode_vtol_cpp example_mode_mission_cpp example_rover_velocity_mode_cpp example_mode_goto_cpp example_mode_rtl_replacement_cpp example_global_navigation_cpp
          target-ros2-distro: jazzy
          vcs-repo-file-url: dependencies.repos
          skip-tests: true
      - name: clang-tidy
        run: |
          ROS_WS_DIR="$(readlink -f ${{ steps.ros-build.outputs.ros-workspace-directory-name }})"
          # action-ros-ci copies the repo under $ROS_WS_DIR/src; find it there
          # (the step's own CWD has no src/).
          repo_dir="$(find "$ROS_WS_DIR/src" -maxdepth 3 -type d -name '${{ github.event.repository.name }}' | head -1)"
          cd "$repo_dir"
          ./scripts/run-clang-tidy-on-project.sh "$ROS_WS_DIR/build"
