name: Feature request
description: Suggest an improvement to px4-ros2-interface-lib (px4_ros2_cpp or px4_ros2_py)
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!

        **Note:** New or changed *message / service fields* must be proposed
        against [PX4-Autopilot](https://github.com/PX4/PX4-Autopilot/issues),
        since the `px4_msgs` definitions this library consumes are generated
        from there. Use this form for changes to the library API, bindings,
        build, CI, or docs.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem, e.g. "I'm always frustrated when [...]"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Target package
      options:
        - px4_ros2_cpp (C++ library)
        - px4_ros2_py (Python bindings)
        - both
        - not sure
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, mode/setpoint use case, PX4 version, or ROS 2 distro relevant to the request.
